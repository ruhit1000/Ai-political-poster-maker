<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; padding: 0; width: 1080px; height: 1080px; font-family: 'SolaimanLipi', sans-serif; background-color: #f1f8e9; }
  .poster-container { width: 100%; height: 100%; position: relative; background: linear-gradient(135deg, #1b5e20, #4caf50); color: white; overflow: hidden; }
  .header { text-align: center; padding: 40px; }
  .headline { font-size: 80px; font-weight: bold; color: #ffeb3b; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); margin: 0; }
  .sub-headline { font-size: 40px; margin-top: 10px; }
  .leaders { display: flex; justify-content: center; gap: 40px; margin-top: 20px; }
  .leader-img { width: 150px; height: 150px; border-radius: 50%; border: 4px solid white; object-fit: cover; }
  .user-section { position: absolute; bottom: 0; left: 0; width: 100%; background: #d32f2f; padding: 30px; display: flex; align-items: center; box-sizing: border-box; }
  .user-photo { width: 250px; height: 250px; border: 5px solid white; border-radius: 20px; object-fit: cover; margin-top: -100px; z-index: 10; background: white; }
  .user-info { margin-left: 40px; flex-grow: 1; }
  .user-name { font-size: 60px; font-weight: bold; margin: 0; }
  .user-designation { font-size: 30px; margin: 5px 0 0 0; color: #ffcdd2; }
  .footer-credit { position: absolute; bottom: 10px; right: 20px; font-size: 20px; font-style: italic; opacity: 0.8; }
</style>
</head>
<body>
  <div class="poster-container">
    <div class="header">
      <h1 class="headline">{{headline}}</h1>
      <div class="sub-headline">শুভেচ্ছা ও অভিনন্দন</div>
      <div class="leaders">
        {{#if leader1}}<img src="{{leader1}}" class="leader-img" />{{/if}}
        {{#if leader2}}<img src="{{leader2}}" class="leader-img" />{{/if}}
      </div>
    </div>
    
    <div class="user-section">
      {{#if userPhoto}}<img src="{{userPhoto}}" class="user-photo" />{{/if}}
      <div class="user-info">
        <h2 class="user-name">{{userName}}</h2>
        <p class="user-designation">{{userDesignation}}</p>
      </div>
    </div>
    <div class="footer-credit">প্রচারে: {{userDesignation}}</div>
  </div>
</body>
</html>
