<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; padding: 0; width: 1080px; height: 1080px; font-family: 'SolaimanLipi', sans-serif; background-color: #eceff1; }
  .poster-container { width: 100%; height: 100%; position: relative; background: linear-gradient(135deg, #263238, #546e7a); color: white; overflow: hidden; border: 20px solid #000; box-sizing: border-box; }
  .header { text-align: center; padding: 50px; }
  .headline { font-size: 70px; font-weight: bold; color: #ffffff; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); margin: 0; }
  .leaders { display: flex; justify-content: center; margin-top: 30px; }
  .leader-img { width: 180px; height: 180px; border-radius: 50%; border: 4px solid #9e9e9e; object-fit: cover; filter: grayscale(100%); }
  .user-section { position: absolute; bottom: 0; left: 0; width: 100%; background: #000000; padding: 30px; display: flex; align-items: center; box-sizing: border-box; }
  .user-photo { width: 220px; height: 220px; border: 5px solid #757575; border-radius: 10px; object-fit: cover; margin-top: -80px; z-index: 10; background: #fff; filter: grayscale(50%); }
  .user-info { margin-left: 40px; flex-grow: 1; }
  .user-name { font-size: 55px; font-weight: bold; margin: 0; }
  .user-designation { font-size: 28px; margin: 5px 0 0 0; color: #b0bec5; }
</style>
</head>
<body>
  <div class="poster-container">
    <div class="header">
      <h1 class="headline">{{headline}}</h1>
      <div class="leaders">
        {{#if leader1}}<img src="{{leader1}}" class="leader-img" />{{/if}}
      </div>
    </div>
    
    <div class="user-section">
      {{#if userPhoto}}<img src="{{userPhoto}}" class="user-photo" />{{/if}}
      <div class="user-info">
        <h2 class="user-name">শোকাহত: {{userName}}</h2>
        <p class="user-designation">{{userDesignation}}</p>
      </div>
    </div>
  </div>
</body>
</html>
